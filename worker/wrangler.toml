# Brace Gemini relayer. Do not put secrets or keypairs in this file.
# Account ID is not secret. RELAYER_SECRET is set via the Workers secrets API, never committed.
# Deploy with `npx wrangler deploy` using CLOUDFLARE_API_TOKEN from the environment (never stored in the repo).
# wrangler deploy keeps existing secrets, the D1 binding below and the minute cron.
name = "brace-relayer"
main = "src/index.ts"
compatibility_date = "2026-11-17"
account_id = "f5541f7a5c900e912b145e07fbc95d63"

[vars]
PROGRAM_ID = "Frv6CVJKADmkM2cnBSMKgBWPvtHsfYkfye5d4vB84WyC"
RPC_URL = "https://solana-devnet.api.onfinality.io/public"
# Comma-separated fallback list. OnFinality first; Tatum verified from a Cloudflare
# Worker to accept getLatestBlockhash and sendTransaction on Solana devnet.
# Official https://api.devnet.solana.com returns 403 from Cloudflare Worker IPs.
RPC_URLS = "https://solana-devnet.api.onfinality.io/public,https://solana-devnet.gateway.tatum.io"

# Minute cron is enabled (Task 7). Keep this on future deploys or the live posts stop.
[triggers]
crons = ["* * * * *"]

# D1 is used by /streams, /history and /actions.
[[d1_databases]]
binding = "DB"
database_name = "brace"
database_id = "117e5eff-90f6-415e-80cd-5ba350ad47dc"

# Per-IP limit for the public GET endpoints (60 per minute per IP per endpoint, per Cloudflare location).
# The code also keeps an in-memory window per isolate, so it still limits if this binding is ever removed.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
